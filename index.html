<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7fa">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="소중한 날, 함께해 주세요. 모바일 청첩장입니다.">
<title>우리의 날 · 모바일 청첩장</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#faf7fa;color:#514551;font-family:system-ui,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#faf7fa}.status{position:fixed;z-index:2;inset:0;display:grid;place-content:center;text-align:center;padding:28px;background:#faf7fa}.status[hidden]{display:none}h1{font-family:Georgia,serif;font-size:27px;font-weight:400}p{line-height:1.8;font-size:14px}a{color:inherit;text-underline-offset:5px}button{border:1px solid #d8c9d5;background:white;color:inherit;border-radius:30px;padding:12px 24px;font:inherit;cursor:pointer}.heart{font-size:32px;color:#b36c88}#fallback[hidden]{display:none}
</style>
</head>
<body>
<div class="status" id="status" role="status"><div class="heart" aria-hidden="true">♡</div><h1>Our wedding day</h1><p id="message">청첩장을 불러오고 있어요.</p><div id="fallback" hidden><p><a id="direct" rel="noopener">청첩장 바로 열기</a></p><button id="retry" type="button">다시 불러오기</button></div></div>
<iframe id="invitation" title="모바일 청첩장" allow="autoplay; clipboard-write; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<noscript><p>청첩장을 보려면 JavaScript를 켜 주세요.</p></noscript>
<script>
'use strict';
const backend='https://ourday-invitation-studio.gongjaksae.chatgpt.site';
const defaultId='7391446f-3d00-45a6-b975-ef6406ca1a8d';
const id=new URLSearchParams(location.search).get('id')||defaultId;
const frame=document.getElementById('invitation'),status=document.getElementById('status'),message=document.getElementById('message');
if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){
 message.textContent='올바르지 않은 청첩장 링크입니다. 보내주신 분께 링크를 다시 요청해 주세요.';
 frame.remove();
}else{
 const url=backend+'/c/'+id;
 document.getElementById('direct').href=url;
 let timeout;
 function openInvitation(){status.hidden=false;document.getElementById('fallback').hidden=true;message.textContent='청첩장을 불러오고 있어요.';clearTimeout(timeout);frame.src=url;timeout=setTimeout(()=>{message.textContent='연결이 늦어지고 있어요. 아래 버튼으로 청첩장을 직접 열 수 있습니다.';document.getElementById('fallback').hidden=false;},18000);}
 window.addEventListener('message',event=>{if(event.origin===backend&&event.source===frame.contentWindow&&event.data?.type==='ourday:ready'&&event.data.id===id){clearTimeout(timeout);status.hidden=true;}});
 document.getElementById('retry').addEventListener('click',openInvitation);
 openInvitation();
}
</script>
</body>
</html>
